name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.txt
      - name: Summarise failures
        if: failure()
        run: |
          # Surface the failing assertions as a check annotation. The raw job
          # log needs admin rights to download, but annotations are readable
          # from the PR, which makes a red build diagnosable at a glance.
          {
            echo "Failing assertions:"
            echo
            grep -E '^not ok|^# (tests|pass|fail|skipped)' /tmp/test-output.txt || true
            echo
            echo "First failure detail:"
            echo
            awk '/^not ok/{flag=1} flag' /tmp/test-output.txt | head -60 || true
            echo
            echo "Skip reasons:"
            echo
            grep -oE 'MongoDB test server unavailable: [^"]*' /tmp/test-output.txt | sort -u | head -5 || true
          } >&2
          exit 1

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
