name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.txt
      - name: Summarise failures
        if: failure()
        run: |
          # The job log needs admin rights to download, so publish the failing
          # assertions to the run summary as well — that is readable from the
          # PR and makes a red build diagnosable at a glance.
          {
            echo '## Backend test failures'
            echo
            echo '```'
            grep -E '^not ok|^# (tests|pass|fail|skipped)' /tmp/test-output.txt || true
            echo '```'
            echo
            echo '<details><summary>First failure detail</summary>'
            echo
            echo '```'
            awk '/^not ok/{flag=1} flag' /tmp/test-output.txt | head -80 || true
            echo '```'
            echo
            echo 'Skip reasons:'
            echo '```'
            grep -oE 'MongoDB test server unavailable: [^"\n]*' /tmp/test-output.txt | sort -u | head -5 || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
